customHeaders:
  - pattern: "**/*"
    headers:
      - key: "Strict-Transport-Security"
        value: "max-age=31536000; includeSubDomains; preload"
      - key: "X-Frame-Options"
        value: "DENY"
      - key: "X-Content-Type-Options"
        value: "nosniff"
      - key: "Referrer-Policy"
        value: "strict-origin-when-cross-origin"
      - key: "Permissions-Policy"
        value: "camera=(), microphone=(), geolocation=(), payment=()"
      - key: "X-XSS-Protection"
        value: "1; mode=block"
      - key: "Content-Security-Policy"
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://pagead2.googlesyndication.com https://fundingchoicesmessages.google.com https://ep1.adtrafficquality.google https://www.google.com https://partner.googleadservices.com https://www.googleadservices.com https://adservice.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; frame-src https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://www.google.com https://bid.g.doubleclick.net; connect-src 'self' https://pagead2.googlesyndication.com https://fundingchoicesmessages.google.com https://www.google-analytics.com; object-src 'none'; base-uri 'self'; form-action 'self'"
  - pattern: "**/*.html"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=3600, stale-while-revalidate=86400"
  - pattern: "**/assets/**"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=31536000, immutable"
  - pattern: "**/*.css"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=31536000, immutable"
  - pattern: "**/*.js"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=31536000, immutable"
  - pattern: "**/sitemap.xml"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=86400"
      - key: "Content-Type"
        value: "application/xml; charset=utf-8"
  - pattern: "**/robots.txt"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=86400"
